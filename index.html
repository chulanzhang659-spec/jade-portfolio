<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eeeae1">
  <meta name="description" content="JADE'S PORTFOLIO — 品牌故事、影像与访谈、账号运营与时尚编辑。">
  <title>JADE'S PORTFOLIO</title>
  <link rel="stylesheet" href="style.css?v=20261020d">
  <script src="data.js" defer></script>
  <script src="home-motion.js" defer></script>
  <script src="keyboard-surface.js" defer></script>
  <script src="home.js" defer></script>
  <script src="app.js?v=20261020d" defer></script>
</head>
<body data-view="home">
  <nav class="toolbar" aria-label="页面导航">
    <button id="back" hidden>← <span>返回首页</span></button>
    <button id="sound" aria-pressed="false" title="开启或关闭打字音效">SOUND OFF</button>
  </nav>
  <section id="home-scene" aria-label="打字机首页">
    <div id="home-artboard">
      <div class="home-paper-plane">
        <div id="home-stock" role="button" tabindex="0" aria-label="点击这张纸，进入作品目录">
          <h1>JADE’S PORTFOLIO</h1>
          <div id="home-lines" aria-hidden="true"></div>
          <img class="home-original-portrait" src="jade-original.jpg" alt="">
        </div>
      </div>
      <img id="reference-machine" src="home-reference.png" alt="固定机位的象牙白复古打字机" fetchpriority="high">
      <div id="keys" aria-label="打字机按键"></div>
    </div>
  </section>
  <main id="stage">
    <div id="paper-anchor">
      <article class="paper" id="paper-directory" aria-label="作品专栏目录">
        <header class="masthead">
          <button class="brand enter" aria-label="进入作品目录">JADE’S PORTFOLIO</button>
          <div class="edition-line"><span></span><button class="enter" id="edition">OPEN THE EDITION →</button><span></span></div>
        </header>
        <div id="columns" class="columns"></div>
        <footer class="paper-footer"><span>WORDS, IMAGES & EVERYTHING BETWEEN.</span><span>JADE · SELECTED WORK</span></footer>
      </article>
      <article class="paper category" id="category" hidden aria-label="专栏作品"></article>
    </div>
  </main>
  <div id="turn-layer" aria-hidden="true"></div>
  <dialog id="reader" aria-label="作品 PDF 阅读器">
    <header><div><small>READ THE ORIGINAL</small><h2 id="reader-title"></h2></div><a id="reader-download" download>下载 PDF ↓</a><button id="close-reader" aria-label="关闭阅读器">关闭 ×</button></header>
    <p class="reader-fallback">若浏览器未显示文件，可<a id="reader-open" target="_blank" rel="noopener">在新窗口阅读</a>，或下载后查看。</p>
    <iframe id="pdf-frame" title="PDF 原稿"></iframe>
  </dialog>
  <noscript>请启用 JavaScript，以使用打字机交互、作品目录和 PDF 阅读器。</noscript>
</body>
</html>
